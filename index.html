<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player - VideoPlay.fun</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        /* Responsive banner styles */
        .ad-container {
            text-align: center;
            margin: 10px 0;
        }

        .ad-iframe {
            max-width: 100%;
            height: auto;
        }

        /* Video player adjustments */
        .video-player-section {
            margin-bottom: 15px;
        }

        .related-videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        /* Optional: make video player responsive */
        #mainVideoPlayer {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="back-btn">← Back to Videos</a>
            <h1 class="logo">VideoPlay.fun</h1>
        </div>
    </header>

    <!-- Top Banner -->
    <div class="ad-container">
        <script type="text/javascript">
            atOptions = {
                'key' : '43fc97b9028c31d1675dcb4dc9f5321f',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="//www.highperformanceformat.com/43fc97b9028c31d1675dcb4dc9f5321f/invoke.js"></script>
    </div>

    <!-- Main Video Player -->
    <main class="main">
        <div class="container">
            <div class="video-player-section">
                <video 
                    id="mainVideoPlayer" 
                    controls 
                    autoplay 
                    class="main-video-player">
                    Your browser does not support the video tag.
                </video>
                
                <div class="video-info">
                    <h2 id="videoTitle">Video Title</h2>
                    <p id="videoDescription">Video description will appear here</p>
                </div>
            </div>

            <!-- Native Banner -->
            <div class="ad-container">
                <script async="async" data-cfasync="false" src="//pl27820359.effectivegatecpm.com/8f9d0b9283e8a567681ee534de56afd3/invoke.js"></script>
                <div id="container-8f9d0b9283e8a567681ee534de56afd3"></div>
            </div>

            <!-- Related Videos -->
            <div class="related-videos-section">
                <h3>Related Videos</h3>
                <div class="related-videos-grid" id="relatedVideos">
                    <!-- Related videos will be loaded here -->
                </div>
            </div>

            <!-- Bottom Banner -->
            <div class="ad-container">
                <script type="text/javascript">
                    atOptions = {
                        'key' : 'adf0bc0c2f371b15e8d05c2e17ec8305',
                        'format' : 'iframe',
                        'height' : 60,
                        'width' : 468,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/adf0bc0c2f371b15e8d05c2e17ec8305/invoke.js"></script>
            </div>
        </div>
    </main>

    <!-- Popunder Ad -->
    <script type='text/javascript' src='//pl27816605.effectivegatecpm.com/d7/d9/b5/d7d9b5e6ca04b307c731ac045a8205f0.js'></script>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 VideoPlay.fun - All rights reserved</p>
        </div>
    </footer>

    <script src="assets/script.js"></script>

    <!-- Optional: Mobile banner adjustment -->
    <script>
        // Adjust fixed banners for mobile
        document.addEventListener('DOMContentLoaded', () => {
            const topBanner = document.querySelectorAll('.ad-container iframe');
            topBanner.forEach(iframe => {
                if(window.innerWidth <= 768){
                    iframe.width = 320;
                    iframe.height = (iframe.height/iframe.width)*320; // maintain aspect ratio
                }
            });
        });
    </script>
</body>
</html>
